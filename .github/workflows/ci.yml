name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python3 -m py_compile scripts/depvet_check.py

      - name: Unit tests (offline, pure functions)
        run: python3 tests/test_offline.py

      - name: CLI is runnable
        run: python3 scripts/depvet_check.py --help > /dev/null

      - name: SKILL.md frontmatter is valid
        run: python3 tests/test_frontmatter.py

  live:
    runs-on: ubuntu-latest
    continue-on-error: true   # live registries can rate-limit runner IPs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Live npm smoke test
        run: python3 scripts/depvet_check.py react
      - name: Live JSON output
        run: python3 scripts/depvet_check.py --json lodash | python3 -m json.tool > /dev/null
      - name: Live BLOCK exit code
        run: |
          if python3 scripts/depvet_check.py definitely-not-a-real-package-xyz; then
            echo "expected non-zero exit"; exit 1
          fi
