name: CI

# ⚠️ TEMPORARY: workflow_dispatch only.
#
# Why: the account's GitHub Actions are locked by a billing issue
# ("The job was not started because your account is locked due to a
# billing issue."), so every push-triggered run fails before a runner
# is allocated and shows red checks on every commit.
#
# HOW TO RESTORE FULL CI after resolving billing
# (Settings → Billing and plans → fix payment / raise spending limit):
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#     workflow_dispatch:
#
# Until then, run CI manually: Actions tab → CI → Run workflow.
# (The workflow itself is correct — it passed locally: 76/76 offline
# unit tests + live registry smoke tests.)

on:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python3 -m py_compile scripts/depvet_check.py

      - name: Unit tests (offline, pure functions)
        run: python3 tests/test_offline.py

      - name: GitHub Action logic (offline simulation)
        run: python3 tests/test_action.py

      - name: CLI is runnable
        run: python3 scripts/depvet_check.py --help > /dev/null

      - name: SKILL.md frontmatter is valid
        run: python3 tests/test_frontmatter.py

  live:
    runs-on: ubuntu-latest
    continue-on-error: true   # live registries can rate-limit runner IPs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Live npm smoke test
        run: python3 scripts/depvet_check.py react
      - name: Live lockfile scan
        run: |
          printf '{"lockfileVersion":3,"packages":{"":{"name":"t"},"node_modules/express":{"version":"4.19.2"}}}' > /tmp/package-lock.json
          python3 scripts/depvet_check.py --lockfile /tmp/package-lock.json
      - name: Live JSON output
        run: python3 scripts/depvet_check.py --json lodash | python3 -m json.tool > /dev/null
      - name: Live BLOCK exit code
        run: |
          if python3 scripts/depvet_check.py definitely-not-a-real-package-xyz; then
            echo "expected non-zero exit"; exit 1
          fi
